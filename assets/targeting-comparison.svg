<svg xmlns="http://www.w3.org/2000/svg" width="790" height="254" viewBox="0 0 790 254" role="img" aria-label="At a 30 percent email budget, the men's targeting model minus random difference was negative 1.06 extra purchases per 1,000 eligible customers, 95 percent interval negative 2.96 to positive 1.00. The women's difference was positive 0.49, interval negative 1.03 to positive 2.29. Both intervals cross zero.">
  <rect width="790" height="254" rx="12" fill="#f8fafc"/>
  <g font-family="Arial,sans-serif">
    <text x="24" y="31" font-size="17" font-weight="bold" fill="#182b49">Did the model beat random targeting?</text>
    <text x="24" y="53" font-size="12" fill="#516176">Same budget: email 30% of eligible customers · held-out evaluation</text>
    <g stroke="#dce4ed" stroke-width="1">
      <line x1="217" y1="72" x2="217" y2="175"/><line x1="301" y1="72" x2="301" y2="175"/>
      <line x1="384" y1="72" x2="384" y2="175"/><line x1="551" y1="72" x2="551" y2="175"/>
      <line x1="635" y1="72" x2="635" y2="175"/><line x1="718" y1="72" x2="718" y2="175"/>
    </g>
    <line x1="468" y1="70" x2="468" y2="176" stroke="#49586a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <g fill="#334155" font-size="13">
      <text x="24" y="106">Men's email</text><text x="24" y="159">Women's email</text>
    </g>
    <g stroke="#3176af" stroke-width="3" stroke-linecap="round">
      <line x1="220" y1="101" x2="551" y2="101"/>
      <line x1="220" y1="94" x2="220" y2="108"/><line x1="551" y1="94" x2="551" y2="108"/>
    </g>
    <circle cx="379" cy="101" r="6" fill="#3176af"/>
    <g stroke="#cf2e69" stroke-width="3" stroke-linecap="round">
      <line x1="382" y1="154" x2="659" y2="154"/>
      <line x1="382" y1="147" x2="382" y2="161"/><line x1="659" y1="147" x2="659" y2="161"/>
    </g>
    <circle cx="509" cy="154" r="6" fill="#cf2e69"/>
    <g fill="#516176" font-size="11" text-anchor="middle">
      <text x="217" y="192">-3</text><text x="301" y="192">-2</text><text x="384" y="192">-1</text><text x="468" y="192">0</text><text x="551" y="192">+1</text><text x="635" y="192">+2</text><text x="718" y="192">+3</text>
    </g>
    <text x="468" y="212" text-anchor="middle" font-size="12" fill="#334155">Model minus random · extra purchases per 1,000 eligible</text>
    <text x="24" y="235" font-size="12" fill="#516176">Dots = estimated difference · lines = 95% confidence intervals · both cross 0</text>
  </g>
</svg>
